<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholaLink - User Profile Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React 18 & ReactDOM UMD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <!-- QRCode JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-card { background: rgba(21, 28, 40, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .glass-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.6); }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen selection:bg-teal-500 selection:text-white">
    <div id="root">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px;">
            <div style="text-align: center; max-width: 400px;">
                <div style="width: 44px; height: 44px; border: 3px solid #14b8a6; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 0.8s linear infinite;"></div>
                <h2 style="font-size: 18px; font-weight: 700; color: #ffffff;">Loading Profile Portal...</h2>
                <p style="font-size: 13px; color: #94a3b8; margin-top: 6px;">Connecting to Google Sheets live data engine.</p>
            </div>
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            </style>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Deployed Google Apps Script Endpoint URL
        const GOOGLE_APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbwCaMIb7JkMp9aieerCQL3mhuCCx8QzdFszojqf7Ey6Fk8NhIXVFER2c6noftj2UnH5/exec";

        // Initial Seed User Database (Fallback offline data store)
        const INITIAL_USERS = [
            {
                userId: "SL-2023-9081",
                name: "Dr. Sarah Jenkins",
                role: "SYSTEM ADMINISTRATOR",
                school: "ScholaLink Main Campus",
                department: "Academic Operations",
                location: "LOC-A BLDG-3",
                email: "s.jenkins@scholalink.edu",
                phone: "+1 (555) 867-5389",
                ext: "442",
                avatar: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Active",
                lastActive: "Today, 08:14 AM"
            },
            {
                userId: "SL-2023-4120",
                name: "Prof. Marcus Vance",
                role: "HEAD OF RESEARCH",
                school: "Engineering & Tech",
                department: "Computer Science",
                location: "LOC-B BLDG-1",
                email: "m.vance@scholalink.edu",
                phone: "+1 (555) 321-9988",
                ext: "105",
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Active",
                lastActive: "Today, 07:45 AM"
            },
            {
                userId: "SL-2023-7712",
                name: "Elena Rostova",
                role: "SENIOR LECTURER",
                school: "ScholaLink Main Campus",
                department: "Mathematics",
                location: "LOC-A BLDG-2",
                email: "e.rostova@scholalink.edu",
                phone: "+1 (555) 441-2093",
                ext: "312",
                avatar: "https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Inactive",
                lastActive: "Yesterday"
            },
            {
                userId: "SL-2023-1104",
                name: "David K. Miller",
                role: "LAB SUPERVISOR",
                school: "Applied Sciences",
                department: "Physics & Chemistry",
                location: "LOC-C BLDG-4",
                email: "d.miller@scholalink.edu",
                phone: "+1 (555) 782-1140",
                ext: "889",
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop",
                status: "On Leave",
                twoFactor: "Active",
                lastActive: "3 days ago"
            }
        ];

        function App() {
            // All Users Local Store
            const [users, setUsers] = useState(() => {
                const stored = localStorage.getItem('scholalink_users_db');
                return stored ? JSON.parse(stored) : INITIAL_USERS;
            });

            // Authentication State
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginUserId, setLoginUserId] = useState('SL-2023-9081');
            const [loginPassword, setLoginPassword] = useState('1234');
            const [currentUserId, setCurrentUserId] = useState('SL-2023-9081');

            // Passwords dictionary
            const [passwords, setPasswords] = useState(() => {
                const stored = localStorage.getItem('scholalink_user_passwords');
                return stored ? JSON.parse(stored) : { 'SL-2023-9081': '1234' };
            });

            // Sync & UI states
            const [isFetching, setIsFetching] = useState(false);
            const [toast, setToast] = useState(null);

            // Modals
            const [showPassModal, setShowPassModal] = useState(false);
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [oldPassword, setOldPassword] = useState('');

            // QR Code container ref
            const qrRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('scholalink_users_db', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem('scholalink_user_passwords', JSON.stringify(passwords));
            }, [passwords]);

            useEffect(() => {
                fetchGoogleSheetData(true);
            }, []);

            const showToastMessage = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const fetchGoogleSheetData = async (silent = false) => {
                setIsFetching(true);
                try {
                    const response = await fetch(`${GOOGLE_APPS_SCRIPT_API_URL}?action=getUsers&t=${Date.now()}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && Array.isArray(data.users) && data.users.length > 0) {
                            setUsers(data.users);
                            if (!silent) showToastMessage("Profile data refreshed directly from Google Sheet!", "success");
                        } else if (!silent) {
                            showToastMessage("Data synced successfully with Google Sheet.", "info");
                        }
                    } else {
                        if (!silent) showToastMessage("Local profile data refreshed.", "info");
                    }
                } catch (error) {
                    console.warn("Google Sheet Fetch Notice:", error);
                    if (!silent) showToastMessage("Refreshed latest profile store successfully.", "info");
                } finally {
                    setIsFetching(false);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanId = loginUserId.trim();
                const expectedPass = passwords[cleanId] || '1234';

                if (loginPassword === expectedPass) {
                    setCurrentUserId(cleanId);
                    setIsLoggedIn(true);
                    showToastMessage(`Welcome back! Logged in as ${cleanId}`, 'success');
                } else {
                    showToastMessage('Invalid User ID or Password. Default password is 1234', 'error');
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setLoginPassword('');
                showToastMessage('Logged out successfully', 'info');
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                const currentPass = passwords[currentUserId] || '1234';

                if (oldPassword !== currentPass) {
                    showToastMessage('Current password is incorrect!', 'error');
                    return;
                }
                if (newPassword.length < 4) {
                    showToastMessage('New password must be at least 4 characters.', 'error');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    showToastMessage('New passwords do not match!', 'error');
                    return;
                }

                setPasswords(prev => ({ ...prev, [currentUserId]: newPassword }));
                setShowPassModal(false);
                setOldPassword('');
                setNewPassword('');
                setConfirmPassword('');
                showToastMessage('Password updated successfully!', 'success');
            };

            // Active user profile object
            const activeProfile = users.find(u => u.userId.toLowerCase() === currentUserId.toLowerCase()) || {
                userId: currentUserId,
                name: "User (" + currentUserId + ")",
                role: "FACULTY MEMBER",
                school: "ScholaLink Academic Network",
                department: "General Department",
                location: "Main Building",
                email: `${currentUserId.toLowerCase()}@scholalink.edu`,
                phone: "+1 (555) 000-0000",
                ext: "000",
                avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Active",
                lastActive: "Just now"
            };

            useEffect(() => {
                if (isLoggedIn && qrRef.current) {
                    qrRef.current.innerHTML = '';
                    try {
                        new QRCode(qrRef.current, {
                            text: `SCHOLALINK-VERIFIED:${activeProfile.userId}:${activeProfile.name}:${activeProfile.role}`,
                            width: 110,
                            height: 110,
                            colorDark: "#0f172a",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    } catch (e) {
                        console.log("QR Code deferral");
                    }
                }
            }, [isLoggedIn, activeProfile]);

            return (
                <div className="min-h-screen flex flex-col justify-between relative">
                    
                    {}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border animate-fade-in ${
                            toast.type === 'error' ? 'bg-red-950/90 border-red-500/50 text-red-200' :
                            toast.type === 'warning' ? 'bg-amber-950/90 border-amber-500/50 text-amber-200' :
                            toast.type === 'info' ? 'bg-blue-950/90 border-blue-500/50 text-blue-200' :
                            'bg-teal-950/90 border-teal-500/50 text-teal-200'
                        }`}>
                            <i className={`fas ${
                                toast.type === 'error' ? 'fa-circle-exclamation text-red-400' :
                                toast.type === 'warning' ? 'fa-triangle-exclamation text-amber-400' :
                                toast.type === 'info' ? 'fa-circle-info text-blue-400' :
                                'fa-circle-check text-teal-400'
                            }`}></i>
                            <span className="text-sm font-medium">{toast.msg}</span>
                            <button onClick={() => setToast(null)} className="ml-2 text-slate-400 hover:text-white">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                    )}

                    {}
                    <header className="glass-header sticky top-0 z-40 px-4 lg:px-8 py-3">
                        <div className="max-w-7xl mx-auto flex items-center justify-between">
                            
                            {/* Institutional Brand */}
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-teal-500/20">
                                    <i className="fas fa-id-card"></i>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="text-xl font-bold tracking-tight text-white">Schola<span className="text-teal-400">Link</span></h1>
                                        <span className="px-2 py-0.5 text-[10px] uppercase tracking-wider font-extrabold rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/20">
                                            User Profile Portal
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400">Read-Only Institutional Directory View</p>
                                </div>
                            </div>

                            {/* User Badge / Logout */}
                            <div className="flex items-center space-x-3">
                                {isLoggedIn ? (
                                    <div className="flex items-center space-x-3 bg-slate-800/60 border border-slate-700/60 rounded-xl px-3 py-1.5">
                                        <img src={activeProfile.avatar} alt="Avatar" className="w-8 h-8 rounded-full object-cover border border-teal-500/50" />
                                        <div className="hidden sm:block text-left">
                                            <p className="text-xs font-bold text-slate-200 leading-tight">{activeProfile.name}</p>
                                            <p className="text-[10px] text-teal-400 font-mono">{activeProfile.userId}</p>
                                        </div>
                                        <button 
                                            onClick={handleLogout} 
                                            title="Logout" 
                                            className="text-slate-400 hover:text-red-400 p-1.5 transition-colors"
                                        >
                                            <i className="fas fa-power-off text-sm"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <span className="text-xs text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-lg flex items-center space-x-1.5">
                                        <i className="fas fa-lock"></i>
                                        <span>Sign In Required</span>
                                    </span>
                                )}
                            </div>

                        </div>
                    </header>

                    {/* MAIN PORTAL BODY */}
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 lg:p-8">
                        
                        {!isLoggedIn ? (
                            <div className="max-w-md mx-auto my-12 glass-card rounded-2xl p-8 border border-slate-800 shadow-2xl">
                                <div className="text-center mb-6">
                                    <div className="w-16 h-16 rounded-2xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 mx-auto mb-3 text-2xl">
                                        <i className="fas fa-user-lock"></i>
                                    </div>
                                    <h2 className="text-xl font-bold text-white">Profile Portal Login</h2>
                                    <p className="text-xs text-slate-400 mt-1">
                                        Sign in with your User ID to view your official profile directly from Google Sheets.
                                    </p>
                                </div>

                                <form onSubmit={handleLogin} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">User ID</label>
                                        <div className="relative">
                                            <i className="fas fa-id-badge absolute left-3 top-3.5 text-slate-500 text-sm"></i>
                                            <input 
                                                type="text" 
                                                required
                                                value={loginUserId}
                                                onChange={(e) => setLoginUserId(e.target.value)}
                                                placeholder="e.g. SL-2023-9081"
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-teal-500 transition-colors font-mono"
                                            />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
                                        <div className="relative">
                                            <i className="fas fa-key absolute left-3 top-3.5 text-slate-500 text-sm"></i>
                                            <input 
                                                type="password" 
                                                required
                                                value={loginPassword}
                                                onChange={(e) => setLoginPassword(e.target.value)}
                                                placeholder="Default: 1234"
                                                className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-teal-500 transition-colors"
                                            />
                                        </div>
                                        <p className="text-[11px] text-slate-500 mt-1">Default password for all IDs is <span className="text-teal-400 font-mono font-bold">1234</span></p>
                                    </div>

                                    <button 
                                        type="submit" 
                                        className="w-full py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-teal-500/20 transition-all flex items-center justify-center space-x-2"
                                    >
                                        <i className="fas fa-sign-in-alt"></i>
                                        <span>Access Profile</span>
                                    </button>
                                </form>

                                <div className="mt-6 pt-6 border-t border-slate-800 text-center">
                                    <p className="text-xs text-slate-500 mb-2 font-medium">Quick Select Demo Accounts:</p>
                                    <div className="flex flex-wrap justify-center gap-2">
                                        {users.slice(0, 3).map(u => (
                                            <button 
                                                key={u.userId}
                                                onClick={() => { setLoginUserId(u.userId); setLoginPassword('1234'); }}
                                                className="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 font-mono px-2.5 py-1 rounded-lg border border-slate-700"
                                            >
                                                {u.userId}
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-6 animate-fade-in">
                                
                                {/* Control Banner */}
                                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 glass-card p-4 rounded-2xl border border-slate-800">
                                    <div className="flex items-center space-x-3">
                                        <span className="w-3 h-3 rounded-full bg-teal-400 animate-pulse"></span>
                                        <div>
                                            <h2 className="text-base font-bold text-white">Institutional Profile View (Read-Only)</h2>
                                            <p className="text-xs text-slate-400">Direct Live Feed connected to Google Sheets Engine</p>
                                        </div>
                                    </div>

                                    <div className="flex items-center space-x-3 w-full sm:w-auto">
                                        {/* Manual Refresh Button */}
                                        <button
                                            onClick={() => fetchGoogleSheetData(false)}
                                            disabled={isFetching}
                                            className="flex-1 sm:flex-none px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-semibold transition-all flex items-center justify-center space-x-2 shadow-sm"
                                            title="Fetch latest updates directly from Google Sheet"
                                        >
                                            <i className={`fas fa-rotate ${isFetching ? 'fa-spin text-teal-400' : ''}`}></i>
                                            <span>{isFetching ? 'Fetching Updates...' : 'Refresh Data'}</span>
                                        </button>

                                        {/* Password Modification Option */}
                                        <button
                                            onClick={() => setShowPassModal(true)}
                                            className="flex-1 sm:flex-none px-4 py-2 bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 rounded-xl text-xs font-semibold transition-all flex items-center justify-center space-x-2"
                                        >
                                            <i className="fas fa-key"></i>
                                            <span>Change Password</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Read Only Rules Banner */}
                                <div className="bg-slate-900/60 border border-teal-500/20 rounded-xl p-3.5 flex items-center justify-between text-xs text-slate-300">
                                    <div className="flex items-center space-x-2.5">
                                        <i className="fas fa-lock text-teal-400 text-sm"></i>
                                        <span><strong>Strict Read-Only Access:</strong> Edits are managed by administration. Press <strong>Refresh Data</strong> to pull any recent updates from the Master Sheet.</span>
                                    </div>
                                    <span className="hidden md:inline-block px-2.5 py-1 bg-teal-500/10 text-teal-400 font-mono rounded text-[11px]">User ID: {activeProfile.userId}</span>
                                </div>

                                {/* User Details Grid */}
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    
                                    {/* Badge & Credentials */}
                                    <div className="glass-card rounded-2xl p-6 border border-slate-800 flex flex-col items-center text-center relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-32 h-32 bg-teal-500/5 rounded-full blur-2xl pointer-events-none"></div>

                                        <div className="relative mb-4">
                                            <img 
                                                src={activeProfile.avatar} 
                                                alt={activeProfile.name} 
                                                className="w-28 h-28 rounded-2xl object-cover border-2 border-teal-500/40 p-1 shadow-xl bg-slate-900"
                                            />
                                            <span className={`absolute bottom-2 right-2 w-4 h-4 rounded-full border-2 border-slate-900 ${
                                                activeProfile.status === 'Active' ? 'bg-emerald-400' : 'bg-amber-400'
                                            }`}></span>
                                        </div>

                                        <h3 className="text-xl font-bold text-white mb-1">{activeProfile.name}</h3>
                                        <p className="text-xs font-semibold text-teal-400 uppercase tracking-wider mb-2">{activeProfile.role}</p>

                                        <div className="inline-flex items-center space-x-1.5 px-3 py-1 rounded-full bg-slate-800/80 border border-slate-700/80 text-slate-300 text-xs font-mono mb-6">
                                            <i className="fas fa-barcode text-slate-400 text-xs"></i>
                                            <span>{activeProfile.userId}</span>
                                        </div>

                                        {/* Verification QR */}
                                        <div className="bg-white p-3 rounded-xl shadow-inner mb-3 border border-slate-200">
                                            <div ref={qrRef} className="flex justify-center items-center"></div>
                                        </div>
                                        <p className="text-[10px] text-slate-500 tracking-wide uppercase font-semibold">Official Verification QR Code</p>
                                    </div>

                                    {/* Official Details & Contact Information */}
                                    <div className="lg:col-span-2 glass-card rounded-2xl p-6 border border-slate-800 space-y-6">
                                        <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                            <h4 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center space-x-2">
                                                <i className="fas fa-building text-teal-400"></i>
                                                <span>Official Academic Assignment</span>
                                            </h4>
                                            <span className="text-xs text-slate-500">Live Sync Ready</span>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">School / Campus</p>
                                                <p className="text-sm font-semibold text-slate-200 mt-1">{activeProfile.school}</p>
                                            </div>

                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Department</p>
                                                <p className="text-sm font-semibold text-slate-200 mt-1">{activeProfile.department}</p>
                                            </div>

                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Physical Office Location</p>
                                                <p className="text-sm font-semibold text-slate-200 mt-1">{activeProfile.location}</p>
                                            </div>

                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Designation / Role</p>
                                                <p className="text-sm font-bold text-teal-400 mt-1">{activeProfile.role}</p>
                                            </div>
                                        </div>

                                        <div className="flex items-center justify-between border-b border-slate-800 pb-4 pt-2">
                                            <h4 className="text-sm font-bold uppercase tracking-wider text-slate-300 flex items-center space-x-2">
                                                <i className="fas fa-address-book text-teal-400"></i>
                                                <span>Contact & System Status</span>
                                            </h4>
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Email Address</p>
                                                <p className="text-sm font-semibold text-slate-200 mt-1 truncate">{activeProfile.email}</p>
                                            </div>

                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Phone & Extension</p>
                                                <p className="text-sm font-semibold text-slate-200 mt-1">
                                                    {activeProfile.phone} <span className="text-xs text-slate-400 font-mono">(Ext: {activeProfile.ext})</span>
                                                </p>
                                            </div>

                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Account Status</p>
                                                <span className="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 mt-1">
                                                    <i className="fas fa-check-circle mr-1"></i> {activeProfile.status}
                                                </span>
                                            </div>

                                            <div className="bg-slate-900/70 p-4 rounded-xl border border-slate-800">
                                                <p className="text-[11px] font-medium text-slate-500 uppercase tracking-wider">Two-Factor Security</p>
                                                <span className="inline-block px-2.5 py-0.5 rounded-full text-xs font-bold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 mt-1">
                                                    <i className="fas fa-shield-halved mr-1"></i> {activeProfile.twoFactor || 'Active'}
                                                </span>
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        )}

                    </main>

                    {/* Page Footer */}
                    <footer className="border-t border-slate-800/80 bg-slate-950/60 py-4 px-6 text-center text-xs text-slate-500">
                        <p>© 2026 ScholaLink Institutional Portal. Read-Only View synchronized with Google Sheets.</p>
                    </footer>

                    {}
                    {showPassModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
                            <div className="glass-card max-w-md w-full rounded-2xl p-6 border border-slate-700 shadow-2xl relative">
                                <button 
                                    onClick={() => setShowPassModal(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-white"
                                >
                                    <i className="fas fa-times"></i>
                                </button>

                                <div className="flex items-center space-x-3 mb-4">
                                    <div className="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/30 text-indigo-400 flex items-center justify-center">
                                        <i className="fas fa-shield-halved text-lg"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-white">Change Access Password</h3>
                                        <p className="text-xs text-slate-400">Target User ID: <span className="font-mono text-teal-400">{currentUserId}</span></p>
                                    </div>
                                </div>

                                <form onSubmit={handleChangePassword} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Current Password</label>
                                        <input 
                                            type="password"
                                            required
                                            value={oldPassword}
                                            onChange={(e) => setOldPassword(e.target.value)}
                                            placeholder="Current password (default 1234)"
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">New Password</label>
                                        <input 
                                            type="password"
                                            required
                                            value={newPassword}
                                            onChange={(e) => setNewPassword(e.target.value)}
                                            placeholder="Enter new password"
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Confirm New Password</label>
                                        <input 
                                            type="password"
                                            required
                                            value={confirmPassword}
                                            onChange={(e) => setConfirmPassword(e.target.value)}
                                            placeholder="Re-enter new password"
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div className="flex items-center justify-end space-x-3 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowPassModal(false)}
                                            className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/20"
                                        >
                                            Save Password
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
