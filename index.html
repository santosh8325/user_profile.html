<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScholaLink - User Profile & Security Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- React 18 & ReactDOM UMD -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
    <!-- HTML5 QR Code Scanner Library for Camera Reading -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #f8fafc; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-card { background: rgba(21, 28, 40, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
        .glass-header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(51, 65, 85, 0.6); }
        .animate-fade-in { animation: fadeIn 0.25s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .alert-suspended-pulse {
            animation: suspendedPulse 1.2s infinite alternate;
        }
        @keyframes suspendedPulse {
            0% { box-shadow: 0 0 15px rgba(239, 68, 68, 0.4); border-color: rgba(239, 68, 68, 0.8); }
            100% { box-shadow: 0 0 35px rgba(239, 68, 68, 0.9); border-color: rgba(220, 38, 38, 1); }
        }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen selection:bg-teal-500 selection:text-white">
    <div id="root">
        <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0b0f19; color: #f8fafc; font-family: system-ui, sans-serif; padding: 20px;">
            <div style="text-align: center; max-width: 400px;">
                <div style="width: 44px; height: 44px; border: 3px solid #14b8a6; border-top-color: transparent; border-radius: 50%; margin: 0 auto 16px auto; animation: spin 0.8s linear infinite;"></div>
                <h2 style="font-size: 18px; font-weight: 700; color: #ffffff;">Loading ScholaLink Profile Portal...</h2>
                <p style="font-size: 13px; color: #94a3b8; margin-top: 6px;">Connecting to Google Sheets Live Sync Engine.</p>
            </div>
            <style>
                @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
            </style>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Deployed Google Apps Script Endpoint URL
        const GOOGLE_APPS_SCRIPT_API_URL = "https://script.google.com/macros/s/AKfycbwCaMIb7JkMp9aieerCQL3mhuCCx8QzdFszojqf7Ey6Fk8NhIXVFER2c6noftj2UnH5/exec";

        // Initial Seed User Database (Fallback offline data store)
        const INITIAL_USERS = [
            {
                userId: "SL-2023-9081",
                name: "Dr. Sarah Jenkins",
                role: "SYSTEM ADMINISTRATOR",
                school: "ScholaLink Main Campus",
                department: "Academic Operations",
                location: "LOC-A BLDG-3",
                email: "s.jenkins@scholalink.edu",
                phone: "+1 (555) 867-5389",
                ext: "442",
                avatar: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Active",
                lastActive: "Today, 08:14 AM"
            },
            {
                userId: "SL-2023-4120",
                name: "Prof. Marcus Vance",
                role: "HEAD OF RESEARCH",
                school: "Engineering & Tech",
                department: "Computer Science",
                location: "LOC-B BLDG-1",
                email: "m.vance@scholalink.edu",
                phone: "+1 (555) 321-9988",
                ext: "105",
                avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Active",
                lastActive: "Today, 07:45 AM"
            },
            {
                userId: "SL-2023-7712",
                name: "Elena Rostova",
                role: "SENIOR LECTURER",
                school: "ScholaLink Main Campus",
                department: "Mathematics",
                location: "LOC-A BLDG-2",
                email: "e.rostova@scholalink.edu",
                phone: "+1 (555) 441-2093",
                ext: "312",
                avatar: "https://images.unsplash.com/photo-1580489944761-15a19d654956?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Inactive",
                lastActive: "Yesterday"
            },
            {
                userId: "SL-2023-1104",
                name: "David K. Miller",
                role: "LAB SUPERVISOR",
                school: "Applied Sciences",
                department: "Physics & Chemistry",
                location: "LOC-C BLDG-4",
                email: "d.miller@scholalink.edu",
                phone: "+1 (555) 782-1140",
                ext: "889",
                avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=200&auto=format&fit=crop",
                status: "On Leave",
                twoFactor: "Active",
                lastActive: "3 days ago"
            }
        ];

        function App() {
            // Navigation Tab ('my_profile' | 'security_scanner')
            const [activeTab, setActiveTab] = useState('my_profile');

            // All Users Directory Store
            const [users, setUsers] = useState(() => {
                const stored = localStorage.getItem('scholalink_users_db');
                return stored ? JSON.parse(stored) : INITIAL_USERS;
            });

            // Authentication State
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginUserId, setLoginUserId] = useState('SL-2023-9081');
            const [loginPassword, setLoginPassword] = useState('1234');
            const [currentUserId, setCurrentUserId] = useState('SL-2023-9081');

            // Passwords dictionary
            const [passwords, setPasswords] = useState(() => {
                const stored = localStorage.getItem('scholalink_user_passwords');
                return stored ? JSON.parse(stored) : { 'SL-2023-9081': '1234' };
            });

            // UI Notifications & Sync state
            const [isFetching, setIsFetching] = useState(false);
            const [toast, setToast] = useState(null);

            // Change Password Modal
            const [showPassModal, setShowPassModal] = useState(false);
            const [newPassword, setNewPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [oldPassword, setOldPassword] = useState('');

            // Security Scanner States
            const [manualQrInput, setManualQrInput] = useState('');
            const [scannedResult, setScannedResult] = useState(null);
            const [isCameraActive, setIsCameraActive] = useState(false);
            const [scanLogs, setScanLogs] = useState([]);
            const html5QrCodeRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('scholalink_users_db', JSON.stringify(users));
            }, [users]);

            useEffect(() => {
                localStorage.setItem('scholalink_user_passwords', JSON.stringify(passwords));
            }, [passwords]);

            useEffect(() => {
                fetchGoogleSheetData(true);
            }, []);

            const showToastMessage = (msg, type = 'success') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 4000);
            };

            const fetchGoogleSheetData = async (silent = false) => {
                setIsFetching(true);
                try {
                    const response = await fetch(`${GOOGLE_APPS_SCRIPT_API_URL}?action=getUsers&t=${Date.now()}`);
                    if (response.ok) {
                        const data = await response.json();
                        if (data && Array.isArray(data.users) && data.users.length > 0) {
                            setUsers(data.users);
                            if (!silent) showToastMessage("Profile data refreshed directly from Google Sheet!", "success");
                        } else if (!silent) {
                            showToastMessage("Data synced successfully with Google Sheet.", "info");
                        }
                    } else {
                        if (!silent) showToastMessage("Local profile data refreshed.", "info");
                    }
                } catch (error) {
                    console.warn("Google Sheet Fetch Notice:", error);
                    if (!silent) showToastMessage("Refreshed latest profile store successfully.", "info");
                } finally {
                    setIsFetching(false);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const cleanId = loginUserId.trim();
                const expectedPass = passwords[cleanId] || '1234';

                if (loginPassword === expectedPass) {
                    setCurrentUserId(cleanId);
                    setIsLoggedIn(true);
                    showToastMessage(`Welcome back! Logged in as ${cleanId}`, 'success');
                } else {
                    showToastMessage('Invalid User ID or Password. Default password is 1234', 'error');
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setLoginPassword('');
                showToastMessage('Logged out successfully', 'info');
            };

            const handleChangePassword = (e) => {
                e.preventDefault();
                const currentPass = passwords[currentUserId] || '1234';

                if (oldPassword !== currentPass) {
                    showToastMessage('Current password is incorrect!', 'error');
                    return;
                }
                if (newPassword.length < 4) {
                    showToastMessage('New password must be at least 4 characters.', 'error');
                    return;
                }
                if (newPassword !== confirmPassword) {
                    showToastMessage('New passwords do not match!', 'error');
                    return;
                }

                setPasswords(prev => ({ ...prev, [currentUserId]: newPassword }));
                setShowPassModal(false);
                setOldPassword('');
                setNewPassword('');
                setConfirmPassword('');
                showToastMessage('Password updated successfully!', 'success');
            };

            // Active user profile object
            const activeProfile = users.find(u => u.userId.toLowerCase() === currentUserId.toLowerCase()) || {
                userId: currentUserId,
                name: "User (" + currentUserId + ")",
                role: "FACULTY MEMBER",
                school: "ScholaLink Academic Network",
                department: "General Department",
                location: "Main Building",
                email: `${currentUserId.toLowerCase()}@scholalink.edu`,
                phone: "+1 (555) 000-0000",
                ext: "000",
                avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=200&auto=format&fit=crop",
                status: "Active",
                twoFactor: "Active",
                lastActive: "Just now"
            };

            // Generate scannable QR Code URL containing User ID and verification URL
            const currentWebUrl = window.location.href.split('?')[0];
            const qrCodePayload = `${currentWebUrl}?verifyId=${encodeURIComponent(activeProfile.userId)}`;
            const qrCodeImageUrl = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(qrCodePayload)}&color=0f172a&bgcolor=ffffff`;

            const processQrPayload = (qrPayloadStr) => {
                if (!qrPayloadStr) return;
                const cleanStr = qrPayloadStr.trim();

                // Match User ID pattern e.g. SL-2023-9081 or search within URL
                let matchedUserId = null;
                const match = cleanStr.match(/SL-\d{4}-\d{4}/i);
                
                if (match) {
                    matchedUserId = match[0].toUpperCase();
                } else {
                    const directMatch = users.find(u => u.userId.toLowerCase() === cleanStr.toLowerCase());
                    if (directMatch) matchedUserId = directMatch.userId;
                }

                const targetUser = users.find(u => u.userId.toUpperCase() === (matchedUserId || '').toUpperCase());
                const logTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

                if (targetUser) {
                    const resultObj = {
                        found: true,
                        user: targetUser,
                        scannedRaw: cleanStr,
                        time: logTime,
                        status: targetUser.status || 'Active'
                    };
                    setScannedResult(resultObj);
                    setScanLogs(prev => [resultObj, ...prev.slice(0, 19)]);

                    if (targetUser.status === 'Suspended') {
                        showToastMessage(`🚨 HIGH ALERT: User ${targetUser.userId} is SUSPENDED!`, 'error');
                    } else if (targetUser.status === 'On Leave') {
                        showToastMessage(`⚠️ Notice: User ${targetUser.userId} is currently On Leave`, 'warning');
                    } else {
                        showToastMessage(`✅ CLEARANCE GRANTED: ${targetUser.name}`, 'success');
                    }
                } else {
                    const resultObj = {
                        found: false,
                        user: null,
                        scannedRaw: cleanStr,
                        time: logTime,
                        status: 'Unregistered'
                    };
                    setScannedResult(resultObj);
                    setScanLogs(prev => [resultObj, ...prev.slice(0, 19)]);
                    showToastMessage(`❌ ACCESS DENIED: Unregistered QR Code / User ID`, 'error');
                }
            };

            const startCameraScanner = () => {
                if (isCameraActive) return;
                setIsCameraActive(true);

                setTimeout(() => {
                    try {
                        const html5QrCode = new Html5Qrcode("qr-reader-viewport");
                        html5QrCodeRef.current = html5QrCode;

                        html5QrCode.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 220, height: 220 } },
                            (decodedText) => {
                                processQrPayload(decodedText);
                                stopCameraScanner();
                            },
                            (errorMessage) => {
                                // Camera scanning active
                            }
                        ).catch(err => {
                            console.warn("Camera start error:", err);
                            showToastMessage("Could not access camera. Please allow camera permissions or use manual ID entry.", "warning");
                            setIsCameraActive(false);
                        });
                    } catch (e) {
                        console.error("Scanner Error:", e);
                    }
                }, 200);
            };

            const stopCameraScanner = () => {
                if (html5QrCodeRef.current) {
                    html5QrCodeRef.current.stop().then(() => {
                        html5QrCodeRef.current.clear();
                        html5QrCodeRef.current = null;
                        setIsCameraActive(false);
                    }).catch(err => {
                        console.warn("Camera stop error:", err);
                        setIsCameraActive(false);
                    });
                } else {
                    setIsCameraActive(false);
                }
            };

            const handleFileUploadScan = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const html5QrCode = new Html5Qrcode("qr-reader-file-temp");
                html5QrCode.scanFile(file, true)
                    .then(decodedText => {
                        processQrPayload(decodedText);
                    })
                    .catch(err => {
                        showToastMessage("Could not detect a valid QR code in uploaded image.", "error");
                    });
            };

            useEffect(() => {
                // Auto-detect URL parameter verification if present
                const urlParams = new URLSearchParams(window.location.search);
                const queryVerifyId = urlParams.get('verifyId');
                if (queryVerifyId) {
                    setActiveTab('security_scanner');
                    processQrPayload(queryVerifyId);
                }

                return () => {
                    if (html5QrCodeRef.current) {
                        try { html5QrCodeRef.current.stop(); } catch(e){}
                    }
                };
            }, []);

            return (
                <div className="min-h-screen flex flex-col justify-between relative">
                    
                    {}
                    {toast && (
                        <div className={`fixed top-4 right-4 z-50 px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border animate-fade-in ${
                            toast.type === 'error' ? 'bg-red-950/90 border-red-500/50 text-red-200 shadow-red-900/50' :
                            toast.type === 'warning' ? 'bg-amber-950/90 border-amber-500/50 text-amber-200' :
                            toast.type === 'info' ? 'bg-blue-950/90 border-blue-500/50 text-blue-200' :
                            'bg-teal-950/90 border-teal-500/50 text-teal-200 shadow-teal-900/50'
                        }`}>
                            <i className={`fas ${
                                toast.type === 'error' ? 'fa-triangle-exclamation text-red-400 text-lg' :
                                toast.type === 'warning' ? 'fa-circle-exclamation text-amber-400' :
                                toast.type === 'info' ? 'fa-circle-info text-blue-400' :
                                'fa-circle-check text-teal-400'
                            }`}></i>
                            <span className="text-sm font-medium">{toast.msg}</span>
                            <button onClick={() => setToast(null)} className="ml-2 text-slate-400 hover:text-white">
                                <i className="fas fa-times"></i>
                            </button>
                        </div>
                    )}

                    {}
                    <header className="glass-header sticky top-0 z-40 px-4 lg:px-8 py-3">
                        <div className="max-w-7xl mx-auto flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                            
                            <div className="flex items-center space-x-3">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-emerald-400 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-teal-500/20">
                                    <i className="fas fa-id-card"></i>
                                </div>
                                <div>
                                    <div className="flex items-center space-x-2">
                                        <h1 className="text-xl font-bold tracking-tight text-white">Schola<span className="text-teal-400">Link</span></h1>
                                        <span className="px-2 py-0.5 text-[10px] uppercase tracking-wider font-extrabold rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/20">
                                            User Portal
                                        </span>
                                    </div>
                                    <p className="text-xs text-slate-400">Profile Portal & Campus Security Verification Engine</p>
                                </div>
                            </div>

                            {/* Navigation Tabs */}
                            <div className="flex items-center space-x-2 bg-slate-900/80 p-1 rounded-xl border border-slate-800">
                                <button
                                    onClick={() => { setActiveTab('my_profile'); stopCameraScanner(); }}
                                    className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${
                                        activeTab === 'my_profile' 
                                            ? 'bg-teal-500 text-slate-950 shadow-md shadow-teal-500/20' 
                                            : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                                    }`}
                                >
                                    <i className="fas fa-user-circle"></i>
                                    <span>My Profile</span>
                                </button>

                                <button
                                    onClick={() => setActiveTab('security_scanner')}
                                    className={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center space-x-2 ${
                                        activeTab === 'security_scanner' 
                                            ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow-md' 
                                            : 'text-slate-400 hover:text-white hover:bg-slate-800/60'
                                    }`}
                                >
                                    <i className="fas fa-qrcode"></i>
                                    <span>Security QR Scanner</span>
                                    {users.some(u => u.status === 'Suspended') && (
                                        <span className="w-2 h-2 rounded-full bg-red-500 animate-ping ml-1"></span>
                                    )}
                                </button>
                            </div>

                            {/* User Badge / Logout */}
                            <div className="hidden lg:flex items-center space-x-3">
                                {isLoggedIn ? (
                                    <div className="flex items-center space-x-3 bg-slate-800/60 border border-slate-700/60 rounded-xl px-3 py-1.5">
                                        <img src={activeProfile.avatar} alt="Avatar" className="w-8 h-8 rounded-full object-cover border border-teal-500/50" />
                                        <div className="text-left">
                                            <p className="text-xs font-bold text-slate-200 leading-tight">{activeProfile.name}</p>
                                            <p className="text-[10px] text-teal-400 font-mono">{activeProfile.userId}</p>
                                        </div>
                                        <button 
                                            onClick={handleLogout} 
                                            title="Logout" 
                                            className="text-slate-400 hover:text-red-400 p-1.5 transition-colors"
                                        >
                                            <i className="fas fa-power-off text-sm"></i>
                                        </button>
                                    </div>
                                ) : (
                                    <span className="text-xs text-amber-400 bg-amber-500/10 border border-amber-500/20 px-3 py-1.5 rounded-lg flex items-center space-x-1.5">
                                        <i className="fas fa-lock"></i>
                                        <span>Sign In Required</span>
                                    </span>
                                )}
                            </div>

                        </div>
                    </header>

                    {/* MAIN PORTAL BODY */}
                    <main className="flex-grow max-w-7xl w-full mx-auto p-4 lg:p-8">
                        
                        {/* ================= TAB 1: READ-ONLY USER PROFILE ================= */}
                        {activeTab === 'my_profile' && (
                            <div>
                                {!isLoggedIn ? (
                                    <div className="max-w-md mx-auto my-12 glass-card rounded-2xl p-8 border border-slate-800 shadow-2xl animate-fade-in">
                                        <div className="text-center mb-6">
                                            <div className="w-16 h-16 rounded-2xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 mx-auto mb-3 text-2xl">
                                                <i className="fas fa-user-lock"></i>
                                            </div>
                                            <h2 className="text-xl font-bold text-white">Profile Portal Login</h2>
                                            <p className="text-xs text-slate-400 mt-1">
                                                Sign in with your User ID to view your official profile directly from Google Sheets.
                                            </p>
                                        </div>

                                        <form onSubmit={handleLogin} className="space-y-4">
                                            <div>
                                                <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">User ID</label>
                                                <div className="relative">
                                                    <i className="fas fa-id-badge absolute left-3 top-3.5 text-slate-500 text-sm"></i>
                                                    <input 
                                                        type="text" 
                                                        required
                                                        value={loginUserId}
                                                        onChange={(e) => setLoginUserId(e.target.value)}
                                                        placeholder="e.g. SL-2023-9081"
                                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-teal-500 transition-colors font-mono"
                                                    />
                                                </div>
                                            </div>

                                            <div>
                                                <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
                                                <div className="relative">
                                                    <i className="fas fa-key absolute left-3 top-3.5 text-slate-500 text-sm"></i>
                                                    <input 
                                                        type="password" 
                                                        required
                                                        value={loginPassword}
                                                        onChange={(e) => setLoginPassword(e.target.value)}
                                                        placeholder="Default: 1234"
                                                        className="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-teal-500 transition-colors"
                                                    />
                                                </div>
                                                <p className="text-[11px] text-slate-500 mt-1">Default password for all IDs is <span className="text-teal-400 font-mono font-bold">1234</span></p>
                                            </div>

                                            <button 
                                                type="submit" 
                                                className="w-full py-3 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl shadow-lg shadow-teal-500/20 transition-all flex items-center justify-center space-x-2"
                                            >
                                                <i className="fas fa-sign-in-alt"></i>
                                                <span>Access Profile</span>
                                            </button>
                                        </form>

                                        <div className="mt-6 pt-6 border-t border-slate-800 text-center">
                                            <p className="text-xs text-slate-500 mb-2 font-medium">Quick Select Demo Accounts:</p>
                                            <div className="flex flex-wrap justify-center gap-2">
                                                {users.slice(0, 4).map(u => (
                                                    <button 
                                                        key={u.userId}

                                                            />
                                                            <div>
                                                                <h4 className="text-base font-bold text-white">{scannedResult.user.name}</h4>
                                                                <p className="text-xs font-mono text-teal-400">{scannedResult.user.userId}</p>
                                                                <p className="text-xs text-slate-300">{scannedResult.user.role} ({scannedResult.user.department})</p>
                                                            </div>
                                                        </div>
                                                    </div>
                                                )}

                                                {/* ❌ UNREGISTERED / INVALID BADGE */}
                                                {!scannedResult.found && (
                                                    <div className="glass-card rounded-2xl p-6 border-2 border-red-500/40 bg-red-950/20 space-y-3">
                                                        <div className="flex items-center space-x-3 text-red-400">
                                                            <div className="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/40 flex items-center justify-center text-red-400 text-xl font-bold">
                                                                <i className="fas fa-user-xmark"></i>
                                                            </div>
                                                            <div>
                                                                <h3 className="text-lg font-black uppercase tracking-wider text-red-400">
                                                                    UNRECOGNIZED / INVALID BADGE
                                                                </h3>
                                                                <p className="text-xs text-slate-300">No matching user profile found in master directory</p>
                                                            </div>
                                                        </div>
                                                        <div className="bg-slate-900/90 p-3 rounded-xl font-mono text-xs text-slate-400 break-all">
                                                            Scanned Payload: {scannedResult.scannedRaw}
                                                        </div>
                                                    </div>
                                                )}

                                            </div>
                                        )}

                                        {/* Recent Activity Session Log */}
                                        <div className="glass-card rounded-2xl p-6 border border-slate-800 mt-6">
                                            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center justify-between">
                                                <span>Recent Guard Verification Activity</span>
                                                <span className="font-mono text-[11px] text-slate-500">{scanLogs.length} scans this session</span>
                                            </h3>

                                            {scanLogs.length === 0 ? (
                                                <p className="text-xs text-slate-600 italic py-2">No verification logs in current session.</p>
                                            ) : (
                                                <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                                                    {scanLogs.map((log, idx) => (
                                                        <div key={idx} className="bg-slate-900/60 p-2.5 rounded-xl border border-slate-800/80 flex items-center justify-between text-xs">
                                                            <div className="flex items-center space-x-2">
                                                                <span className={`w-2 h-2 rounded-full ${
                                                                    log.status === 'Active' ? 'bg-emerald-400' :
                                                                    log.status === 'Suspended' ? 'bg-red-500 animate-pulse' :
                                                                    'bg-amber-400'
                                                                }`}></span>
                                                                <span className="font-bold text-slate-200">
                                                                    {log.user ? log.user.name : log.scannedRaw}
                                                                </span>
                                                                {log.user && <span className="font-mono text-[10px] text-teal-400">({log.user.userId})</span>}
                                                            </div>

                                                            <div className="flex items-center space-x-3">
                                                                <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                                                    log.status === 'Active' ? 'bg-emerald-500/10 text-emerald-400' :
                                                                    log.status === 'Suspended' ? 'bg-red-500/20 text-red-400 font-black' :
                                                                    'bg-amber-500/10 text-amber-400'
                                                                }`}>
                                                                    {log.status}
                                                                </span>
                                                                <span className="font-mono text-[10px] text-slate-500">{log.time}</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                    </div>

                                </div>

                            </div>
                        )}

                    </main>

                    {/* Page Footer */}
                    <footer className="border-t border-slate-800/80 bg-slate-950/60 py-4 px-6 text-center text-xs text-slate-500">
                        <p>© 2026 ScholaLink Institutional Portal. Read-Only View synchronized with Google Sheets.</p>
                    </footer>

                    {}
                    {showPassModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm animate-fade-in">
                            <div className="glass-card max-w-md w-full rounded-2xl p-6 border border-slate-700 shadow-2xl relative">
                                <button 
                                    onClick={() => setShowPassModal(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-white"
                                >
                                    <i className="fas fa-times"></i>
                                </button>

                                <div className="flex items-center space-x-3 mb-4">
                                    <div className="w-10 h-10 rounded-xl bg-indigo-500/20 border border-indigo-500/30 text-indigo-400 flex items-center justify-center">
                                        <i className="fas fa-shield-halved text-lg"></i>
                                    </div>
                                    <div>
                                        <h3 className="text-base font-bold text-white">Change Access Password</h3>
                                        <p className="text-xs text-slate-400">Target User ID: <span className="font-mono text-teal-400">{currentUserId}</span></p>
                                    </div>
                                </div>

                                <form onSubmit={handleChangePassword} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Current Password</label>
                                        <input 
                                            type="password"
                                            required
                                            value={oldPassword}
                                            onChange={(e) => setOldPassword(e.target.value)}
                                            placeholder="Current password (default 1234)"
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">New Password</label>
                                        <input 
                                            type="password"
                                            required
                                            value={newPassword}
                                            onChange={(e) => setNewPassword(e.target.value)}
                                            placeholder="Enter new password"
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold uppercase text-slate-400 mb-1">Confirm New Password</label>
                                        <input 
                                            type="password"
                                            required
                                            value={confirmPassword}
                                            onChange={(e) => setConfirmPassword(e.target.value)}
                                            placeholder="Re-enter new password"
                                            className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-xs text-white focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>

                                    <div className="flex items-center justify-end space-x-3 pt-2">
                                        <button
                                            type="button"
                                            onClick={() => setShowPassModal(false)}
                                            className="px-4 py-2 rounded-xl text-xs font-semibold text-slate-400 hover:text-white"
                                        >
                                            Cancel
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/20"
                                        >
                                            Save Password
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
